<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên - FPOLY STUDIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <!-- NAVBAR HEADER -->
    <header class="navbar" id="header">
        <div class="nav-wrapper">
            <a href="index.html" class="logo">
                <img src="logo.ico" alt="Logo FPOLY" class="logo-img">
                <div class="logo-text">
                    <span>FPOLY</span>
                    <small>STUDIO</small>
                </div>
            </a>

            <nav class="nav-menu" id="nav-menu">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Trang Chủ</a></li>
                    <li><a href="about.html" class="nav-link">Giới Thiệu</a></li>
                    <li><a href="index.html#products" class="nav-link">Cấu Hình & Giá</a></li>
                    <li><a href="index.html#gallery" class="nav-link">Thư Viện Ảnh</a></li>
                    <li><a href="contact.html" class="nav-link">Liên Hệ & Đặt Chỗ</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="btn-outline-nav"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</a>
                <a href="register.html" class="btn btn-primary" style="padding: 7px 15px; font-size: 0.85rem;"><i class="fa-solid fa-user-plus"></i> Đăng Ký</a>

                <button class="theme-toggle" id="theme-toggle" title="Đổi giao diện">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="mobile-toggle" id="mobile-toggle" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- AUTH WRAPPER WIDE -->
    <div class="auth-wrapper">
        <div class="auth-card wide">
            <div class="auth-header">
                <h2>Đăng Ký Tài Khoản Hội Viên</h2>
                <p>Tạo tài khoản để lưu trữ giờ chơi và nhận ưu đãi riêng tại Studio</p>
            </div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="regFullname">Họ và Tên *</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="regFullname" class="form-control" placeholder="Nguyễn Văn A">
                        </div>
                        <span class="error-msg"></span>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Địa chỉ Email *</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
                        </div>
                        <span class="error-msg"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regUsername">Tên Đăng Nhập *</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-id-badge input-icon"></i>
                            <input type="text" id="regUsername" class="form-control" placeholder="Tối thiểu 4 ký tự">
                        </div>
                        <span class="error-msg"></span>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Số Điện Thoại</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="text" id="regPhone" class="form-control" placeholder="0912345678">
                        </div>
                        <span class="error-msg"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="regPassword">Mật Khẩu *</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự">
                            <i class="fa-solid fa-eye toggle-password"></i>
                        </div>
                        <span class="error-msg"></span>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Xác Nhận Mật Khẩu *</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock-check input-icon"></i>
                            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
                            <i class="fa-solid fa-eye toggle-password"></i>
                        </div>
                        <span class="error-msg"></span>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 0.5rem;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="regTerms">
                        <span>Tôi đồng ý với <a href="#" style="color:var(--primary-color);">Điều khoản & Quy định phòng máy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;"><i class="fa-solid fa-user-plus"></i> Hoàn Tất Đăng Ký</button>
            </form>

            <p class="auth-footer-text">Đã có tài khoản? <a href="login.html" style="color:var(--primary-color); font-weight:700;">Đăng nhập tại đây</a></p>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 FPOLY STUDIO. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
